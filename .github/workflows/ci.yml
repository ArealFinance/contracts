name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: cargo check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `--features yield-distribution/dev-placeholder-mints` is mandatory for
      # devnet/CI builds: yield-distribution ships placeholder RWT/USDC mint
      # bytes guarded by an R20 tripwire that fails compilation unless the
      # feature is enabled. Mainnet builds drop the flag *after* the runbook
      # replaces the placeholder bytes with the real pubkeys.
      - run: cargo check --workspace --all-targets --features yield-distribution/dev-placeholder-mints
